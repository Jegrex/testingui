<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Peserta Magang — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-container">
      <div class="row align-items-center justify-content-center g-4">
        <div class="col-12 col-md-9 col-lg-6">
          <div class="auth-card auth-card-register">
            <div class="text-center">
              <a href="index.html" class="ec-brand justify-content-center">
                <span class="ec-brand-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <span class="ec-brand-text">
                  <span class="ec-brand-top">ENGLISH CAFE</span>
                  <span class="ec-brand-bottom">DAILYREPORT</span>
                </span>
              </a>
              <p class="auth-subtitle">Pendaftaran Akun Peserta Program Magang</p>
            </div>

            <form id="formRegisterPeserta" action="/api/auth/register-peserta" method="post" novalidate>
              <div id="registerAlertBox" aria-live="polite"></div>

              <div class="mb-2">
                <label for="regNama" class="ec-form-label">Nama Lengkap <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="text" id="regNama" name="nama_lengkap" autocomplete="name" minlength="3" enterkeyhint="next" class="ec-form-control" placeholder="Masukkan nama lengkap (min. 3 karakter)" data-error="errRegNama" required />
                  <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                </div>
                <div id="errRegNama" class="ec-field-error"></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-12 col-sm-6">
                  <label for="regEmail" class="ec-form-label">Email <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <span id="regEmailHint" class="ec-field-hint">Format: nama@domain.com</span>
                  <div class="ec-input-group">
                    <input type="email" id="regEmail" name="email" autocomplete="email" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" aria-describedby="regEmailHint" data-error="errRegEmail" class="ec-form-control" placeholder="nama@gmail.com" required />
                    <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-envelope-fill"></i></span>
                  </div>
                  <div id="errRegEmail" class="ec-field-error"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regTelp" class="ec-form-label">Nomor Telepon <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <span id="regTelpHint" class="ec-field-hint">10–15 digit angka aktif</span>
                  <div class="ec-input-group">
                    <input type="tel" id="regTelp" name="no_telepon" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10,15}" enterkeyhint="next" aria-describedby="regTelpHint" data-error="errRegTelp" class="ec-form-control" placeholder="08xxxxxxxxxx" required />
                    <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-telephone-fill"></i></span>
                  </div>
                  <div id="errRegTelp" class="ec-field-error"></div>
                </div>
              </div>

              <div class="mb-2">
                <label for="regAlamat" class="ec-form-label">Alamat Domisili <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="text" id="regAlamat" name="alamat" autocomplete="street-address" minlength="5" enterkeyhint="next" data-error="errRegAlamat" class="ec-form-control" placeholder="Masukkan alamat lengkap" required />
                  <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-geo-alt-fill"></i></span>
                </div>
                <div id="errRegAlamat" class="ec-field-error"></div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-12 col-sm-6">
                  <label for="regInstansi" class="ec-form-label">Asal Instansi / Kampus <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <div class="ec-input-group">
                    <input type="text" id="regInstansi" name="asal_instansi" autocomplete="organization" minlength="3" enterkeyhint="next" data-error="errRegInstansi" class="ec-form-control" placeholder="Nama Universitas / SMK" required />
                    <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-building-fill"></i></span>
                  </div>
                  <div id="errRegInstansi" class="ec-field-error"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regJurusan" class="ec-form-label">Jurusan / Program Studi <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <div class="ec-input-group">
                    <input type="text" id="regJurusan" name="jurusan" minlength="2" enterkeyhint="next" data-error="errRegJurusan" class="ec-form-control" placeholder="Contoh: Teknik Informatika" required />
                    <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-mortarboard-fill"></i></span>
                  </div>
                  <div id="errRegJurusan" class="ec-field-error"></div>
                </div>
              </div>

              <div class="mb-2">
                <label for="regTglMulai" class="ec-form-label">Periode Mulai &amp; Berakhir Magang <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="row g-2">
                  <div class="col-12 col-sm-6">
                    <input type="date" id="regTglMulai" name="tgl_mulai" class="ec-form-control" aria-label="Tanggal Mulai Magang" data-error="errRegMulai" required />
                    <div id="errRegMulai" class="ec-field-error"></div>
                  </div>
                  <div class="col-12 col-sm-6">
                    <input type="date" id="regTglAkhir" name="tgl_akhir" class="ec-form-control" aria-label="Tanggal Akhir Magang" data-error="errRegAkhir" required />
                    <div id="errRegAkhir" class="ec-field-error"></div>
                  </div>
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-12 col-sm-6">
                  <label for="regJenis" class="ec-form-label">Jenis Magang <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <select id="regJenis" name="jenis_magang" class="ec-form-select" data-error="errRegJenis" required>
                    <option value="" selected disabled>Pilih jenis magang</option>
                    <option value="MBKM">MBKM (Kampus Merdeka)</option>
                    <option value="Reguler">Magang Reguler / KKL</option>
                    <option value="PKL">PKL / SMK</option>
                    <option value="Mandiri">Magang Mandiri</option>
                  </select>
                  <div id="errRegJenis" class="ec-field-error"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regDivisi" class="ec-form-label">Divisi Penempatan <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <select id="regDivisi" name="divisi" class="ec-form-select" data-error="errRegDivisi" required>
                    <option value="" selected disabled>Pilih divisi</option>
                    <option value="IT">IT / Web Developer</option>
                    <option value="HRD">HRD English Cafe</option>
                    <option value="Marketing">Digital Marketing &amp; SEO</option>
                    <option value="Public Relation">Public Relation</option>
                    <option value="Finance">Finance &amp; Administrasi</option>
                  </select>
                  <div id="errRegDivisi" class="ec-field-error"></div>
                </div>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-12 col-sm-6">
                  <label for="regPassword" class="ec-form-label">Password <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <span id="regPassHint" class="ec-field-hint">Minimal 6 karakter</span>
                  <div class="ec-input-group">
                    <input type="password" id="regPassword" name="password" autocomplete="new-password" minlength="6" enterkeyhint="next" aria-describedby="regPassHint" data-error="errRegPass" class="ec-form-control" placeholder="Min. 6 karakter" required />
                    <button type="button" class="ec-input-icon" data-toggle-password aria-pressed="false" aria-label="Tampilkan Password">
                      <i class="bi bi-eye-slash" aria-hidden="true"></i>
                    </button>
                  </div>
                  <div id="errRegPass" class="ec-field-error"></div>
                </div>
                <div class="col-12 col-sm-6">
                  <label for="regPasswordConfirm" class="ec-form-label">Konfirmasi Password <span class="ec-req-mark" aria-hidden="true">*</span></label>
                  <span id="regPassConfHint" class="ec-field-hint">Harus sama dengan password</span>
                  <div class="ec-input-group">
                    <input type="password" id="regPasswordConfirm" name="password_confirm" autocomplete="new-password" minlength="6" enterkeyhint="done" aria-describedby="regPassConfHint" data-error="errRegPassConf" class="ec-form-control" placeholder="Ulangi password" required />
                    <button type="button" class="ec-input-icon" data-toggle-password aria-pressed="false" aria-label="Tampilkan Konfirmasi Password">
                      <i class="bi bi-eye-slash" aria-hidden="true"></i>
                    </button>
                  </div>
                  <div id="errRegPassConf" class="ec-field-error"></div>
                </div>
              </div>

              <button type="submit" class="btn-ec-primary btn-primary w-100" id="btnRegisterSubmit">
                <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
                <span>Daftar Akun Peserta</span>
              </button>

              <p class="auth-footer-text">
                Sudah punya akun peserta?
                <a href="02-login-peserta.html">
                  <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                  <span>Masuk di sini</span>
                </a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>

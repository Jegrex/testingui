<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Daily Report — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="04-laporan-peserta.html" class="ec-brand">
          <span class="ec-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="ec-brand-text">
            <span class="ec-brand-top">ENGLISH CAFE</span>
            <span class="ec-brand-bottom">DAILYREPORT</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Menu Peserta Magang">
        <div class="sidebar-section-caption">Menu Peserta Magang</div>
        <a href="03-profil-peserta.html" class="sidebar-link">
          <i class="bi bi-person-fill-gear" aria-hidden="true"></i>
          <span>Profil Saya</span>
        </a>
        <a href="04-laporan-peserta.html" class="sidebar-link active">
          <i class="bi bi-file-earmark-text-fill" aria-hidden="true"></i>
          <span>Logbook Laporan</span>
          <span class="sidebar-badge d-none" id="sidebarRevisiBadge" title="Laporan perlu perbaikan">0</span>
        </a>
        <a href="05-upload-laporan.html" class="sidebar-link">
          <i class="bi bi-cloud-arrow-up-fill" aria-hidden="true"></i>
          <span>Upload Laporan</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebarUserAvatar">
            <svg width="34" height="34" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="17" r="9" fill="#8D5B4C"/>
              <path d="M8 44C8 35.1634 15.1634 28 24 28C32.8366 28 40 35.1634 40 44" fill="#8D5B4C"/>
            </svg>
          </div>
          <div>
            <p class="sidebar-user-name" id="sidebarUserName">Memuat...</p>
            <p class="sidebar-user-email" id="sidebarUserEmail">-</p>
          </div>
        </div>
        <button type="button" class="sidebar-logout" data-logout-btn>
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka Menu Navigasi">
            <i class="bi bi-list fs-5" aria-hidden="true"></i>
          </button>
          <a href="04-laporan-peserta.html" class="btn-ec-back" title="Kembali ke Daftar Laporan">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Kembali</span>
          </a>
        </div>
        <h1 class="topbar-title">Edit / Perbaiki Laporan</h1>
      </header>

      <main class="app-content d-flex align-items-center justify-content-center">
        <div class="report-form-card w-100">
          <!-- Banner Catatan Revisi/Penolakan Mentor (tampil dinamis jika ada catatan) -->
          <div class="mentor-note-box revisi mt-0 mb-3 d-none" id="editMentorNoteBanner">
            <div class="mentor-note-header">
              <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
              <span id="editMentorNoteHeaderText">Catatan Mentor</span>
            </div>
            <div class="mentor-note-text" id="editMentorNoteBodyText">-</div>
          </div>

          <div id="editAlertBox" aria-live="polite"></div>

          <form id="formEditLaporan" action="/api/reports" method="post" novalidate>
            <div class="mb-3">
              <label for="editTglLaporan" class="ec-form-label">Tanggal Laporan <span class="ec-req-mark" aria-hidden="true">*</span></label>
              <input type="date" id="editTglLaporan" name="tglLaporan" class="ec-form-control" data-error="errEditTgl" required />
              <div id="errEditTgl" class="ec-field-error"></div>
            </div>

            <div class="mb-3">
              <label for="editHasilKerja" class="ec-form-label">Hasil Kerja Harian <span class="ec-req-mark" aria-hidden="true">*</span></label>
              <textarea id="editHasilKerja" name="hasilKerja" rows="4" minlength="10" class="ec-form-control" data-error="errEditHasil" required></textarea>
              <div id="errEditHasil" class="ec-field-error"></div>
            </div>

            <div class="mb-3">
              <label for="editKendalaKerja" class="ec-form-label">Kendala yang Dihadapi <span class="ec-req-mark" aria-hidden="true">*</span></label>
              <textarea id="editKendalaKerja" name="kendalaKerja" rows="3" class="ec-form-control" data-error="errEditKendala" required></textarea>
              <div id="errEditKendala" class="ec-field-error"></div>
            </div>

            <div class="mb-4">
              <label for="editBuktiFileInput" class="ec-form-label">Bukti Pekerjaan <span class="ec-req-mark" aria-hidden="true">*</span></label>
              <div class="upload-preview-box mb-2" id="editCurrentProofBox">
                <img src="" alt="Bukti dokumentasi saat ini" class="upload-preview-thumb" id="editProofThumb" />
                <div class="flex-grow-1 min-w-0">
                  <div class="fw-bold small text-truncate" id="editFileName">Memuat bukti...</div>
                  <div class="text-muted" style="font-size: 0.72rem;" id="editProofStatusLabel">Lampiran tersimpan</div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <label class="btn-upload-outline py-1 px-3" style="font-size: 0.78rem;" for="editBuktiFileInput">
                  <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
                  <span id="editUploadBtnLabel">Ganti Gambar Bukti</span>
                  <input type="file" id="editBuktiFileInput" name="buktiPekerjaan" accept="image/*" class="d-none" />
                </label>
              </div>
              <div id="errEditBukti" class="ec-field-error"></div>
            </div>

            <button type="submit" class="btn-ec-primary btn-primary w-100" id="btnSubmitEdit">
              <i class="bi bi-floppy-fill" aria-hidden="true"></i>
              <span id="editSubmitBtnLabel">Simpan Perubahan &amp; Kirim Ulang</span>
            </button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>

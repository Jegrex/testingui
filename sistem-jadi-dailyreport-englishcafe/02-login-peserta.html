<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Peserta Magang — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-container">
      <div class="row align-items-center justify-content-center g-4">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="auth-card" style="max-width: 430px;">
            <div class="text-center mb-3">
              <a href="index.html" class="ec-brand justify-content-center">
                <span class="ec-brand-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <span class="ec-brand-text">
                  <span class="ec-brand-top">ENGLISH CAFE</span>
                  <span class="ec-brand-bottom">DAILYREPORT</span>
                </span>
              </a>
              <p class="auth-subtitle mb-0">Portal Pelaporan Harian Peserta Magang</p>
            </div>

            <form id="formLoginPeserta" action="/api/auth/login-peserta" method="post" novalidate>
              <div id="loginPesertaAlertBox" aria-live="polite"></div>

              <div class="mb-3">
                <label for="loginEmail" class="ec-form-label">Email Peserta <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="email" id="loginEmail" name="email" autocomplete="email" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" data-error="errLoginEmail" class="ec-form-control" placeholder="angeline@gmail.com" required />
                  <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-envelope-fill"></i></span>
                </div>
                <div id="errLoginEmail" class="ec-field-error"></div>
              </div>

              <div class="mb-3">
                <label for="loginPhone" class="ec-form-label">Nomor Telepon <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="tel" id="loginPhone" name="no_telepon" autocomplete="tel" inputmode="numeric" pattern="[0-9]{10,15}" enterkeyhint="next" data-error="errLoginPhone" class="ec-form-control" placeholder="089637491877" required />
                  <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-telephone-fill"></i></span>
                </div>
                <div id="errLoginPhone" class="ec-field-error"></div>
              </div>

              <div class="mb-3">
                <label for="loginPassword" class="ec-form-label">Password <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="password" id="loginPassword" name="password" autocomplete="current-password" enterkeyhint="done" data-error="errLoginPass" class="ec-form-control" placeholder="Masukkan password" required />
                  <button type="button" class="ec-input-icon" data-toggle-password aria-pressed="false" aria-label="Tampilkan Password">
                    <i class="bi bi-eye-slash" aria-hidden="true"></i>
                  </button>
                </div>
                <div id="errLoginPass" class="ec-field-error"></div>
              </div>

              <button type="submit" class="btn-ec-primary btn-primary w-100 mt-1" id="btnLoginPesertaSubmit">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                <span>Masuk ke Dashboard Peserta</span>
              </button>

              <p class="auth-footer-text">
                Belum punya akun?
                <a href="01-register-peserta.html">
                  <i class="bi bi-person-plus-fill" aria-hidden="true"></i>
                  <span>Daftar di sini</span>
                </a>
                &bull;
                <a href="07-login-admin.html">
                  <i class="bi bi-shield-lock-fill" aria-hidden="true"></i>
                  <span>Login Mentor</span>
                </a>
              </p>
            </form>

            <details class="ec-cred-hint">
              <summary>
                <span><i class="bi bi-key-fill me-1" style="color: var(--bs-primary);" aria-hidden="true"></i>Akun Peserta Bawaan</span>
                <i class="bi bi-chevron-down" aria-hidden="true"></i>
              </summary>
              <div class="ec-cred-body">
                <div>Email: <code>angeline@gmail.com</code> &bull; Telp: <code>089637491877</code> &bull; Password: <code>password123</code></div>
                <button type="button" class="btn-ec-chip" id="btnQuickFillPeserta">
                  <i class="bi bi-lightning-charge-fill" aria-hidden="true"></i>
                  <span>Gunakan Akun Contoh</span>
                </button>
              </div>
            </details>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>

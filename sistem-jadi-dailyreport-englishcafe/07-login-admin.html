<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin / Mentor — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-container">
      <div class="row align-items-center justify-content-center g-4">
        <div class="col-12 col-md-7 col-lg-5">
          <div class="auth-card" style="max-width: 400px;">
            <div class="text-center mb-4">
              <a href="index.html" class="ec-brand justify-content-center">
                <span class="ec-brand-icon">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <span class="ec-brand-text">
                  <span class="ec-brand-top">ENGLISH CAFE</span>
                  <span class="ec-brand-bottom">DAILYREPORT</span>
                </span>
              </a>
              <p class="auth-subtitle mb-0">Portal Mentor &amp; Administrator Magang</p>
            </div>

            <form id="formLoginAdmin" action="/api/auth/login-admin" method="post" novalidate>
              <div id="loginAdminAlertBox" aria-live="polite"></div>

              <div class="mb-3">
                <label for="adminUsername" class="ec-form-label">Username atau Email <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="text" id="adminUsername" name="username" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" data-error="errAdminUser" class="ec-form-control" placeholder="admin" required />
                  <span class="ec-input-icon" style="pointer-events: none;" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
                </div>
                <div id="errAdminUser" class="ec-field-error"></div>
              </div>

              <div class="mb-4">
                <label for="adminPassword" class="ec-form-label">Password <span class="ec-req-mark" aria-hidden="true">*</span></label>
                <div class="ec-input-group">
                  <input type="password" id="adminPassword" name="password" autocomplete="current-password" enterkeyhint="done" data-error="errAdminPass" class="ec-form-control" placeholder="Masukkan password mentor" required />
                  <button type="button" class="ec-input-icon" data-toggle-password aria-pressed="false" aria-label="Tampilkan Password">
                    <i class="bi bi-eye-slash" aria-hidden="true"></i>
                  </button>
                </div>
                <div id="errAdminPass" class="ec-field-error"></div>
              </div>

              <button type="submit" class="btn-ec-primary btn-primary w-100" id="btnLoginAdminSubmit">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
                <span>Masuk ke Dashboard Mentor</span>
              </button>

              <p class="auth-footer-text">
                Bukan Mentor?
                <a href="02-login-peserta.html">
                  <i class="bi bi-person-badge-fill" aria-hidden="true"></i>
                  <span>Login Peserta Magang</span>
                </a>
              </p>
            </form>

            <details class="ec-cred-hint">
              <summary>
                <span><i class="bi bi-key-fill me-1" style="color: var(--bs-primary);" aria-hidden="true"></i>Akun Mentor / Admin Bawaan</span>
                <i class="bi bi-chevron-down" aria-hidden="true"></i>
              </summary>
              <div class="ec-cred-body">
                <div>Username: <code>admin</code> &bull; Password: <code>admin123</code></div>
                <button type="button" class="btn-ec-chip" id="btnQuickFillAdmin">
                  <i class="bi bi-lightning-charge-fill" aria-hidden="true"></i>
                  <span>Gunakan Akun Contoh</span>
                </button>
              </div>
            </details>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>

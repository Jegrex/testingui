<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peserta Magang (Admin) — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <!-- Sidebar Admin -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="08-admin-peserta.html" class="ec-brand">
          <span class="ec-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="ec-brand-text">
            <span class="ec-brand-top">ENGLISH CAFE</span>
            <span class="ec-brand-bottom">DAILYREPORT</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Menu Admin Mentor">
        <div class="sidebar-section-caption">Menu Mentor &amp; Admin</div>
        <a href="08-admin-peserta.html" class="sidebar-link active">
          <i class="bi bi-person-fill-gear" aria-hidden="true"></i>
          <span>Profil Peserta</span>
        </a>
        <a href="10-admin-laporan-peserta.html" class="sidebar-link">
          <i class="bi bi-file-earmark-text-fill" aria-hidden="true"></i>
          <span>Laporan Peserta</span>
          <span class="sidebar-badge d-none" id="adminSidebarPendingBadge" title="Total laporan menunggu validasi">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" style="background: #512D23;">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="16" r="8" fill="#fcd3b6"/>
              <path d="M16 14C16 9.5 20 7 24 7C28 7 32 9.5 32 14C30 12 20 12 16 14Z" fill="#2C1A14"/>
              <path d="M10 44C10 35 16 30 24 30C32 30 38 35 38 44" fill="#E84C22"/>
              <path d="M22 30L24 38L26 30" fill="#F39C12"/>
            </svg>
          </div>
          <div>
            <p class="sidebar-user-name" id="sidebarUserName">Admin</p>
            <p class="sidebar-user-email" id="sidebarUserEmail">admin@gmail.com</p>
          </div>
        </div>
        <button type="button" class="sidebar-logout" data-logout-btn>
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka Menu">
            <i class="bi bi-list fs-5" aria-hidden="true"></i>
          </button>
        </div>
        <h1 class="topbar-title">Peserta Magang</h1>
      </header>

      <main class="app-content">
        <!-- Search Bar Card -->
        <search>
          <div class="search-box-card">
            <div class="search-input-wrap">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input type="search" id="searchPesertaInput" placeholder="Cari nama, kampus, atau divisi..." aria-label="Cari nama peserta" />
            </div>
          </div>
        </search>

        <!-- Filter Pills + Division Select -->
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
          <div class="filter-pills mb-0" role="group" aria-label="Filter Status Peserta">
            <button type="button" class="filter-pill-btn active" data-filter-status="all">
              <i class="bi bi-grid-fill" aria-hidden="true"></i>
              <span>Semua (<span id="countAllInterns">0</span>)</span>
            </button>
            <button type="button" class="filter-pill-btn" data-filter-status="aktif">
              <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
              <span>Aktif (<span id="countAktifInterns">0</span>)</span>
            </button>
            <button type="button" class="filter-pill-btn" data-filter-status="selesai">
              <i class="bi bi-flag-fill" aria-hidden="true"></i>
              <span>Selesai (<span id="countSelesaiInterns">0</span>)</span>
            </button>
          </div>

          <div class="filter-bar-single">
            <label for="adminDivisiFilter" class="filter-select-label">
              <i class="bi bi-diagram-3-fill" aria-hidden="true"></i>
              <span>Divisi:</span>
            </label>
            <select id="adminDivisiFilter" class="ec-filter-select" style="min-width: 155px;">
              <option value="all" selected>Semua Divisi</option>
              <option value="IT">Divisi IT</option>
              <option value="HRD">Divisi HRD</option>
              <option value="Marketing">Marketing</option>
              <option value="Public Relation">Public Relation</option>
              <option value="Finance">Finance</option>
            </select>
          </div>
        </div>

        <!-- 5-Column Responsive Grid of Intern Cards -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-3" id="internCardsGrid">
          <div class="col-12 text-center py-4 text-muted">Memuat daftar peserta magang dari server...</div>
        </div>

        <!-- Empty State saat Pencarian / Filter Tidak Ditemukan -->
        <div id="internEmptyState" class="ec-empty-state d-none mt-3" aria-live="polite">
          <i class="bi bi-search" aria-hidden="true"></i>
          <h3 class="fs-6 fw-bold mb-1">Data Peserta Tidak Ditemukan</h3>
          <p class="small text-muted mb-2" id="internEmptyStateText">Tidak ada peserta magang yang cocok dengan kata kunci pencarian atau filter status.</p>
          <button type="button" class="btn-ec-outline py-1 px-3" id="btnResetInternSearch">
            <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i>
            <span>Reset Pencarian</span>
          </button>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Peserta Magang (Admin) — English Cafe DailyReport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css?v=10" rel="stylesheet" />
</head>
<body>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="app-shell">
    <!-- Sidebar Admin -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="08-admin-peserta.html" class="ec-brand">
          <span class="ec-brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="#F39C12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 2v3M10 2v3M14 2v3" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="ec-brand-text">
            <span class="ec-brand-top">ENGLISH CAFE</span>
            <span class="ec-brand-bottom">DAILYREPORT</span>
          </span>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Menu Admin Mentor">
        <div class="sidebar-section-caption">Menu Mentor &amp; Admin</div>
        <a href="08-admin-peserta.html" class="sidebar-link">
          <i class="bi bi-person-fill-gear" aria-hidden="true"></i>
          <span>Profil Peserta</span>
        </a>
        <a href="10-admin-laporan-peserta.html" class="sidebar-link active">
          <i class="bi bi-file-earmark-text-fill" aria-hidden="true"></i>
          <span>Laporan Peserta</span>
          <span class="sidebar-badge d-none" id="adminSidebarPendingBadge" title="Total laporan menunggu validasi">0</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" style="background: #512D23;">
            <svg width="36" height="36" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <circle cx="24" cy="16" r="8" fill="#fcd3b6"/>
              <path d="M16 14C16 9.5 20 7 24 7C28 7 32 9.5 32 14C30 12 20 12 16 14Z" fill="#2C1A14"/>
              <path d="M10 44C10 35 16 30 24 30C32 30 38 35 38 44" fill="#E84C22"/>
              <path d="M22 30L24 38L26 30" fill="#F39C12"/>
            </svg>
          </div>
          <div>
            <p class="sidebar-user-name" id="sidebarUserName">Admin</p>
            <p class="sidebar-user-email" id="sidebarUserEmail">admin@gmail.com</p>
          </div>
        </div>
        <button type="button" class="sidebar-logout" data-logout-btn>
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Keluar</span>
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Buka Menu">
            <i class="bi bi-list fs-5" aria-hidden="true"></i>
          </button>
        </div>
        <h1 class="topbar-title">Laporan Peserta Magang</h1>
      </header>

      <main class="app-content">
        <div class="ec-table-toolbar">
          <div class="filter-bar-single">
            <label for="adminRekapFilter" class="filter-select-label">
              <i class="bi bi-funnel-fill" aria-hidden="true"></i>
              <span>Tampilkan:</span>
            </label>
            <select id="adminRekapFilter" class="ec-filter-select">
              <option value="all" selected>Semua Peserta</option>
              <option value="pending_only">Ada Menunggu Validasi</option>
              <option value="aktif">Peserta Aktif</option>
              <option value="selesai">Peserta Selesai</option>
            </select>
          </div>

          <div class="ec-toolbar-right">
            <search>
              <div class="ec-toolbar-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="search" id="adminRekapSearch" placeholder="Cari nama atau kampus..." aria-label="Cari rekap peserta" />
              </div>
            </search>
          </div>
        </div>

        <div id="adminRekapStatus" role="status" class="visually-hidden"></div>

        <div tabindex="0" role="region" aria-labelledby="adminRekapCaption" class="ec-table-card">
          <table class="ec-table ec-table-stack" id="adminRekapTable">
            <caption id="adminRekapCaption" class="visually-hidden">Tabel Rekapitulasi Laporan Harian Semua Peserta Magang</caption>
            <thead>
              <tr>
                <th scope="col" style="width: 26%;" data-type="text" aria-sort="ascending">
                  <button type="button" commandfor="adminRekapTable" command="--sort">
                    <span>Nama Lengkap</span>
                    <svg class="ec-sort-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path class="sort-asc" d="M8 2.5l4 4.5H4l4-4.5z"/>
                      <path class="sort-desc" d="M8 13.5l4-4.5H4l4 4.5z"/>
                    </svg>
                  </button>
                </th>
                <th scope="col" style="width: 30%;" data-type="text">
                  <button type="button" commandfor="adminRekapTable" command="--sort">
                    <span>Asal Sekolah / Universitas</span>
                    <svg class="ec-sort-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path class="sort-asc" d="M8 2.5l4 4.5H4l4-4.5z"/>
                      <path class="sort-desc" d="M8 13.5l4-4.5H4l4 4.5z"/>
                    </svg>
                  </button>
                </th>
                <th scope="col" style="width: 12%; text-align: center;">Status</th>
                <th scope="col" style="width: 18%;" data-type="number">
                  <button type="button" commandfor="adminRekapTable" command="--sort">
                    <span>Laporan Terkirim</span>
                    <svg class="ec-sort-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                      <path class="sort-asc" d="M8 2.5l4 4.5H4l4-4.5z"/>
                      <path class="sort-desc" d="M8 13.5l4-4.5H4l4 4.5z"/>
                    </svg>
                  </button>
                </th>
                <th scope="col" style="width: 14%; text-align: right;">Aksi</th>
              </tr>
            </thead>
            <tbody id="adminRekapTbody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">Memuat data rekap peserta dari server...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js?v=11"></script>
</body>
</html>
